<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="scoreboard" id="scoreboard">
            <div id="player-score-container">
                <h2>You</h2>
                <span id="player-score">0</span>
            </div>


            <div id="computer-score-container">
                <h2>Computer</h2>
                <span id="computer-score">0</span>
            </div>
        </div>

        <div id="game-container">
            <div id="player-choice-container">
                <h3>Your Move</h3>
                <div id="player-choice"></div>
                <div id="choices-options">
                    <button class="choice-button" id="rock">Rock</button>
                    <button class="choice-button" id="paper">Paper</button>
                    <button class="choice-button" id="scissors">Scissors</button>
                </div>
            </div>
            <div id="computer-choice-container">
                <h3>Computer's Choice</h3>
                <div id="computer-choice"></div>
            </div>
            
            

        </div>
        <div id="restart">
                <button id="restart-button">Restart</button>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
